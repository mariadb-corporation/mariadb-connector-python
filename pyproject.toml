[build-system]
requires = ["setuptools>=68", "wheel", "packaging"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "mariadb"
version = "2.0.0rc2"
description = "MariaDB Connector/Python with Java-equivalent implementation"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "LGPL-2.1-or-later"
authors = [
    {name = "Georg Richter", email = "georg@mariadb.com"},
    {name = "MariaDB Corporation Ab"}
]
maintainers = [
    {name = "MariaDB Corporation Ab"}
]
keywords = ["MariaDB", "MySQL", "database", "connector"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Programming Language :: C",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Database",
]
dependencies = [
    "packaging",
    "cryptography>=3.0.0",
    "cachetools>=5.0.0",
]

[project.optional-dependencies]
# C extension for better performance (must match mariadb version)
c = [
    "mariadb-c==2.0.0rc2",
]
# Connection pooling (must match mariadb version)
pool = [
    "mariadb-pool==2.0.0rc2",
]
# Binary wheels with pre-compiled C extension (must match mariadb version)
binary = [
    "mariadb-binary==2.0.0rc2",
]

# Development dependencies
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "pytest-env",
    "black",
    "flake8",
    "mypy",
    "bandit[toml]",
]
test = [
    "pytest>=6.0",
    "pytest-cov",
    "pytest-env",
]

[project.urls]
Homepage = "https://www.github.com/mariadb-corporation/mariadb-connector-python"
Documentation = "https://mariadb-corporation.github.io/mariadb-connector-python/"
Repository = "https://www.github.com/mariadb-corporation/mariadb-connector-python"
"Bug Tracker" = "https://jira.mariadb.org/"
"Source Code" = "https://www.github.com/mariadb-corporation/mariadb-connector-python"
Changelog = "https://github.com/mariadb-corporation/mariadb-connector-python/blob/main/CHANGELOG.md"

[project.scripts]
mariadb-test = "mariadb.testing:main"

[project.entry-points."sqlalchemy.dialects"]
"mariadb.mariadbconnector_async" = "mariadb.sqlalchemy_mariadb_async:dialect"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["mariadb*"]
exclude = ["mariadb_binary*", "mariadb-c*", "mariadb-pool*"]

[tool.setuptools.package-data]
mariadb = ["*.pyi", "py.typed"]
mariadb_shared = ["py.typed"]

# Test configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]


# Development tools configuration
[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
# The shipped pure-Python library. A bare `mypy` checks exactly these.
files = ["mariadb", "mariadb_shared"]
# Skip non-library trees so a recursive `mypy .` doesn't fail on the duplicate
# `conftest` module (benchmarks/ and benchmarks/async/ and tests/ each define one,
# and `benchmarks/async` can't be a package since `async` is a keyword) and
# doesn't pull in the separately-checked sibling packages.
exclude = [
    '^benchmarks/',
    '^tests/',
    '^build/',
    '^docs/',
    '^helper/',
    '^scripts/',
    '^mariadb-c/',
    '^mariadb-pool/',
    '^setup\.py$',
    '^_build_backend\.py$',
]

[[tool.mypy.overrides]]
module = [
    "numpy",
    "mariadb_c",
    "mariadb_c.*",
    "mariadb_binary",
    "mariadb_binary.*",
    "mariadb_pool",
    "cachetools",
    "sqlalchemy",
    "sqlalchemy.*",
]
ignore_missing_imports = true
# Treat these external/sibling packages as opaque whether or not they happen to
# be pip-installed in the current env, so `mypy .` is reproducible. (mariadb and
# mariadb_shared are NOT listed here — they are checked as source.)
follow_imports = "skip"

[[tool.mypy.overrides]]
# Optional SQLAlchemy dialect integration. sqlalchemy is not a hard dependency
# and its stubs aren't installed here, so its symbols resolve to Any: relax the
# checks that depend on its real types (the `# type: ignore`s are still needed
# when sqlalchemy *is* installed, so don't flag them as unused here).
module = ["mariadb.sqlalchemy_mariadb_async"]
warn_unused_ignores = false
warn_return_any = false

[tool.coverage.run]
source = ["mariadb", "mariadb_c", "mariadb_pool", "mariadb_shared"]
source_pkgs = ["mariadb", "mariadb_c", "mariadb_pool", "mariadb_shared"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    # Exclude abstract methods
    "@abstractmethod",
    "@abc.abstractmethod",
    "\\.\\.\\.",  # Ellipsis in abstract methods
]

[tool.ruff]
line-length = 88
target-version = "py38"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401", "F811"]

# Bandit SAST configuration (CONPY-373).
# Scans every shipped Python tree (mariadb, mariadb_shared, and the Python in
# mariadb-c / mariadb-pool). Only non-shipped trees (tests, benchmarks, build
# artifacts, tooling) are excluded so findings stay actionable. CI and the
# pre-commit hook report AND fail on all severities; nothing is globally
# skipped. Every suppression is a justified inline `# nosec <id>` marker:
#   * B324 / B303 -- protocol-mandated weak hashes (mysql_native_password /
#     caching_sha2_password), kept under the default usedforsecurity=True so
#     FIPS enforcement is preserved;
#   * B105 -- false positives (comparisons of a password against "");
#   * B404 / B603 -- the intentional, shell-free subprocess used at build time
#     to query mariadb_config.
# try/except/pass with a finally / bare except / multiple handlers also carry a
# justified `# nosec B110`; the rest were refactored to contextlib.suppress.
[tool.bandit]
exclude_dirs = [
    "tests",
    "benchmarks",
    "build",
    "docs",
    "helper",
    "scripts",
    "tools",
    "testing",
    ".git",
]
