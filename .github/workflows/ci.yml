---
name: Run CI Tests

on:
  push:
    branches: ['1.1', '2.0*']
  pull_request:
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Publish to Test PyPI'
        required: false
        default: true
        type: boolean
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MYSQL_TEST_HOST: mariadb.example.com
  MYSQL_TEST_PORT: 3306
  MYSQL_TEST_USER: testuser
  MYSQL_TEST_PASSWD: "heyPassw-!*20oRd"
  MYSQL_TEST_DB: testp

jobs:

  setup:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'schedule' ||
      startsWith(github.ref, 'refs/heads/1.1') ||
      startsWith(github.ref, 'refs/heads/2.0')
    outputs:
      matrix: ${{ steps.set-matrix.outputs.final-matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: set-matrix
        name: build matrix
        uses: mariadb-corporation/connector-ci-build-matrix@main
        with:
          additional-matrix: '[{"name": "MariaDB 11.4", "os": "ubuntu-latest", "db-type": "community", "db-tag": "11.4", "python": "3.10"},{"name": "MariaDB 11.4", "os": "ubuntu-latest", "db-type": "community", "db-tag": "11.4", "python": "3.11"},{"name": "MariaDB 11.4", "os": "ubuntu-latest", "db-type": "community", "db-tag": "11.4", "python": "3.12"},{"name": "MariaDB 11.4", "os": "ubuntu-latest", "db-type": "community", "db-tag": "11.4", "python": "3.12", "continue-on-error": true}, {"name": "MariaDB 11.4", "os": "ubuntu-latest", "db-type": "community", "db-tag": "11.4", "python": "pypy3.11-v7.3.21"}]'

  ci-pure-python:
    name: ${{ matrix.name }} (Pure Python) ${{ matrix.python != '' && format(' - python {0}', matrix.python) || '' }}
    needs: setup
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue-on-error || false }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Test Environment
        id: setup-env
        uses: mariadb-corporation/connector-ci-setup@master
        with:
          db-type: ${{ matrix.db-type }}
          db-tag: ${{ matrix.db-tag }}
          test-db-password: ${{ env.MYSQL_TEST_PASSWD }}
          test-db-database: ${{ env.MYSQL_TEST_DB }}
          test-db-port: ${{ env.MYSQL_TEST_PORT }}
          additional-conf: ${{ matrix.additional-conf || '--max_allowed_packet=40M --character-set-server=utf8mb4' }}
          registry-user: ${{ matrix.db-type == 'enterprise' && secrets.ENTERPRISE_USER || (secrets.DOCKER_TOKEN != '' && secrets.DOCKER_LOGIN || '') }}
          registry-password: ${{ matrix.db-type == 'enterprise' && secrets.ENTERPRISE_TOKEN || secrets.DOCKER_TOKEN }}
          os: ${{ matrix.os }}
          maxscale-tag: ${{ matrix.maxscale-tag || ''}}
          init-script-folder: ${{ format('{0}/.github/workflows/init', github.workspace) }}

      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: ${{ matrix.python || '3.13' }}
          allow-prereleases: true

      - name: Run SQLAlchemy tests (Pure Python)
        # SQLAlchemy doesn't test TLS; disable it via ssl=false (the dialect coerces
        # it to a real bool). Run on MariaDB only (skip MySQL) and on the default
        # Python 3.13 only -- SQLAlchemy's own suite fails under PyPy.
        if: ${{ (matrix.python == '' || matrix.python == '3.13') && matrix.db-type != 'mysql' }}
        shell: bash
        run: |
          git clone https://github.com/sqlalchemy/sqlalchemy.git
          cd sqlalchemy
          SQLA_TAG=$(git tag -l 'rel_2_0_*' --sort=-version:refname | head -1)
          echo "Pinning SQLAlchemy to $SQLA_TAG"
          git checkout "$SQLA_TAG"
          python --version
          cd "$GITHUB_WORKSPACE"
          # Apply patches to SQLAlchemy for MariaDB Enterprise compatibility
          bash .github/scripts/apply-sqlalchemy-patches.sh "$GITHUB_WORKSPACE/sqlalchemy"
          python -m pip install .
          cd mariadb-pool && python -m pip install . && cd ..
          python -m pip install pytest typing_extensions
          cd "$GITHUB_WORKSPACE/sqlalchemy"
          python -m pip install -e .
          DIALECT_PREFIX="${{ matrix.db-type == 'mysql' && 'mysql' || 'mariadb' }}"
          # URL-encode password to handle special characters
          ENCODED_PASSWORD=$(python -c "import urllib.parse; print(urllib.parse.quote('$TEST_DB_PASSWORD', safe=''))")
          # SQLAlchemy doesn't test TLS; disable it (the dialect coerces ssl=false to a bool).
          DBURI="${DIALECT_PREFIX}+mariadbconnector://$TEST_DB_USER:${ENCODED_PASSWORD}@$TEST_DB_HOST:$TEST_DB_PORT/$TEST_DB?ssl=false"
          echo "Testing with dburi: ${DIALECT_PREFIX}+mariadbconnector://$TEST_DB_USER:****@$TEST_DB_HOST:$TEST_DB_PORT/$TEST_DB?ssl=false"
          # Skip problematic tests
          # VersioningTest: MariaDB 12.x raises errno 1020 directly instead of 0 rows affected,
          # so SQLAlchemy never sees StaleDataError. Server behavior change, not a connector bug.
          DESELECT_PATTERN="not VersioningTest"
          if [[ "${{ matrix.os }}" == "windows-latest" || "${{ matrix.os }}" == "macos-latest" ]]; then
            DESELECT_PATTERN="not (test_reflect_case_insensitive or test_reflect_via_fk or test_case_sensitive_column_constraint_reflection or test_get_names) and not VersioningTest"
          fi
          python -m pytest -xvs --dburi="$DBURI" --backend-only --ignore=test/aaa_profiling -k "$DESELECT_PATTERN"
        env:
          TEST_DB_USER: ${{ env.MYSQL_TEST_USER }}
          TEST_DB_HOST: ${{ env.MYSQL_TEST_HOST }}
          TEST_DB_DATABASE: ${{ env.MYSQL_TEST_DB }}
          TEST_DB_PORT: ${{ env.MYSQL_TEST_PORT }}
          TEST_DB_PASSWORD: ${{ env.MYSQL_TEST_PASSWD }}
          TEST_DB: ${{ env.MYSQL_TEST_DB }}
          MARIADB_PYTHON_CONNECTOR: python

      - name: Run SQLAlchemy async tests (Pure Python)
        # See note above: ssl=false; default Python 3.13 only (PyPy fails).
        if: ${{ (matrix.python == '' || matrix.python == '3.13') && matrix.db-type != 'mysql' }}
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/sqlalchemy"
          DIALECT_PREFIX="${{ matrix.db-type == 'mysql' && 'mysql' || 'mariadb' }}"
          # URL-encode password to handle special characters
          ENCODED_PASSWORD=$(python -c "import urllib.parse; print(urllib.parse.quote('$TEST_DB_PASSWORD', safe=''))")
          # SQLAlchemy doesn't test TLS; disable it (the dialect coerces ssl=false to a bool).
          DBURI="${DIALECT_PREFIX}+mariadbconnector_async://$TEST_DB_USER:${ENCODED_PASSWORD}@$TEST_DB_HOST:$TEST_DB_PORT/$TEST_DB?ssl=false"
          echo "Testing async with dburi: ${DIALECT_PREFIX}+mariadbconnector_async://$TEST_DB_USER:****@$TEST_DB_HOST:$TEST_DB_PORT/$TEST_DB?ssl=false"
          # Install greenlet for async support
          python -m pip install greenlet
          # Run async tests using mariadb connector's native async support
          # Exclude JSON decimal tests as they are "unexpected successes" (passing but marked as expected to fail)
          # Exclude ServerSideCursorsTest as it requires SQLAlchemy test suite modifications we can't ship
          # Exclude CTETest as it has teardown issues with foreign key constraints
          DESELECT_PATTERN="Async and not ((JSONTest and decimal1) or ServerSideCursorsTest or CTETest)"
          if [[ "${{ matrix.os }}" == "windows-latest" || "${{ matrix.os }}" == "macos-latest" ]]; then
            DESELECT_PATTERN="Async and not (test_reflect_case_insensitive or test_reflect_via_fk or test_case_sensitive_column_constraint_reflection or test_get_names or (JSONTest and decimal1) or ServerSideCursorsTest or CTETest)"
          fi
          python -m pytest -xvs --dburi="$DBURI" --backend-only -k "$DESELECT_PATTERN" test/dialect/test_suite.py
        env:
          TEST_DB_USER: ${{ env.MYSQL_TEST_USER }}
          TEST_DB_HOST: ${{ env.MYSQL_TEST_HOST }}
          TEST_DB_DATABASE: ${{ env.MYSQL_TEST_DB }}
          TEST_DB_PORT: ${{ env.MYSQL_TEST_PORT }}
          TEST_DB_PASSWORD: ${{ env.MYSQL_TEST_PASSWD }}
          TEST_DB: ${{ env.MYSQL_TEST_DB }}
          MARIADB_PYTHON_CONNECTOR: python

      - name: Run tests (Pure Python)
        shell: bash
        run: |
          python --version
          python -m pip install .[test]
          cd mariadb-pool && python -m pip install . && cd ..
          python -m pytest tests -v -s --cov=mariadb --cov=mariadb_pool --cov=mariadb_shared --cov-branch --cov-report=xml
        env:
          TEST_DB_USER: ${{ env.MYSQL_TEST_USER }}
          TEST_DB_HOST: ${{ env.MYSQL_TEST_HOST }}
          TEST_DB_DATABASE: ${{ env.MYSQL_TEST_DB }}
          TEST_DB_PORT: ${{ env.MYSQL_TEST_PORT }}
          TEST_DB_PASSWORD: ${{ env.MYSQL_TEST_PASSWD }}
          TEST_DB_SERVER_CERT: ${{ matrix.db-type != 'mysql' && steps.setup-env.outputs.database-type == 'container' && './.github/workflows/certs/ca_server.crt' || '' }}
          LOCAL_DB: ${{ steps.setup-env.outputs.database-type }}
          PYTHON_VERSION: ${{ steps.setup-python.outputs.python-version }}
          MARIADB_PYTHON_CONNECTOR: mariadb
          RUN_LONG_TEST: 1
          MAXSCALE_TAG: ${{ matrix.maxscale-tag || '' }}
          MXS_TLS_PORT: ${{ steps.setup-env.outputs.mxs-tls-port || '' }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  ci-c-extension:
    name: ${{ matrix.name }} (C Extension) ${{ matrix.python != '' && format(' - python {0}', matrix.python) || '' }}
    needs: setup
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue-on-error || false }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Test Environment
        id: setup-env
        uses: mariadb-corporation/connector-ci-setup@master
        with:
          db-type: ${{ matrix.db-type }}
          db-tag: ${{ matrix.db-tag }}
          test-db-password: ${{ env.MYSQL_TEST_PASSWD }}
          test-db-database: ${{ env.MYSQL_TEST_DB }}
          test-db-port: ${{ env.MYSQL_TEST_PORT }}
          additional-conf: ${{ matrix.additional-conf || '--max_allowed_packet=40M --character-set-server=utf8mb4' }}
          registry-user: ${{ matrix.db-type == 'enterprise' && secrets.ENTERPRISE_USER || (secrets.DOCKER_TOKEN != '' && secrets.DOCKER_LOGIN || '') }}
          registry-password: ${{ matrix.db-type == 'enterprise' && secrets.ENTERPRISE_TOKEN || secrets.DOCKER_TOKEN }}
          os: ${{ matrix.os }}
          maxscale-tag: ${{ matrix.maxscale-tag || ''}}
          init-script-folder: ${{ format('{0}/.github/workflows/init', github.workspace) }}

      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: ${{ matrix.python || '3.13' }}
          allow-prereleases: true

      - name: Clone C/C
        uses: GuillaumeFalourd/clone-github-repo-action@v2.3
        with:
          branch: '3.4'
          owner: 'mariadb-corporation'
          repository: 'mariadb-connector-c'

      - name: c/c make ubuntu
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          cd ${{ github.workspace }}/mariadb-connector-c
          cmake . -DCMAKE_BUILD_TYPE=Release -DWITH_EXTERNAL_ZLIB=On -DCMAKE_INSTALL_PREFIX=/usr
          make -j4
          sudo make install
          echo "MARIADB_PLUGIN_DIR=`mariadb_config --plugindir`" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/lib/mariadb" >> $GITHUB_ENV

      - name: c/c make macos
        if: ${{ startsWith(matrix.os, 'mac') }}
        run: |
          cd ${{ github.workspace }}/mariadb-connector-c
          cmake . -DCMAKE_BUILD_TYPE=Release -DWITH_EXTERNAL_ZLIB=On
          make -j4
          sudo make install
          ls -lrt /usr/local/lib/mariadb/plugin
          echo "MARIADB_PLUGIN_DIR=`mariadb_config --plugindir`" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/lib/mariadb" >> $GITHUB_ENV
          echo "DYLD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib/mariadb:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "DYLD_FALLBACK_LIBRARY_PATH=/usr/local/lib:/usr/local/lib/mariadb" >> $GITHUB_ENV

      - name: c/c make windows
        if: ${{ startsWith(matrix.os, 'windows') }}
        shell: powershell
        run: |
          cd ${{ github.workspace }}/mariadb-connector-c
          $MARIADB_CC_INSTALL_DIR = Join-Path $env:USERPROFILE "conc"
          cmake . -DCMAKE_BUILD_TYPE=RelWithDebInfo -DWITH_CURL=ON -DWITH_NONBLOCK=ON -DCMAKE_INSTALL_PREFIX="$MARIADB_CC_INSTALL_DIR"
          cmake --build . --config RelWithDebInfo
          cmake --install . --config RelWithDebInfo
          echo "MARIADB_CC_INSTALL_DIR=$MARIADB_CC_INSTALL_DIR" >> $env:GITHUB_ENV
          echo "MARIADB_PLUGIN_DIR=$MARIADB_CC_INSTALL_DIR\lib\mariadb\plugin" >> $env:GITHUB_ENV
          echo "$MARIADB_CC_INSTALL_DIR\lib\mariadb" >> $env:GITHUB_PATH

      - name: Enable core dumps (Linux)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          # Persistent kernel setting (carries across step shells)
          sudo sysctl -w kernel.core_pattern="$GITHUB_WORKSPACE/core.%e.%p"
          echo "Core pattern: $(cat /proc/sys/kernel/core_pattern)"
          # gdb / python3-dbg are intentionally NOT installed here. They are only
          # needed to read a core dump, which only exists when a test crashes.
          # The "Analyze core dumps" step installs them on demand, so the ~85 MB
          # apt download stays off the common (no-crash) path.

      - name: Run SQLAlchemy tests (C extension)
        # See note above: ssl=false; default Python 3.13 only (PyPy fails).
        if: ${{ (matrix.python == '' || matrix.python == '3.13') && matrix.db-type != 'mysql' }}
        shell: bash
        run: |
          # ulimit is per-shell; must be set in every step that should dump.
          ulimit -c unlimited
          git clone https://github.com/sqlalchemy/sqlalchemy.git
          cd sqlalchemy
          SQLA_TAG=$(git tag -l 'rel_2_0_*' --sort=-version:refname | head -1)
          echo "Pinning SQLAlchemy to $SQLA_TAG"
          git checkout "$SQLA_TAG"
          python --version
          cd "$GITHUB_WORKSPACE"
          # Apply patches to SQLAlchemy for MariaDB Enterprise compatibility
          bash .github/scripts/apply-sqlalchemy-patches.sh "$GITHUB_WORKSPACE/sqlalchemy"
          python -m pip install .
          cd mariadb-c && python -m pip install . && cd ..
          cd mariadb-pool && python -m pip install . && cd ..
          python -m pip install pytest typing_extensions
          cd "$GITHUB_WORKSPACE/sqlalchemy"
          python -m pip install -e .
          DIALECT_PREFIX="${{ matrix.db-type == 'mysql' && 'mysql' || 'mariadb' }}"
          # URL-encode password to handle special characters
          ENCODED_PASSWORD=$(python -c "import urllib.parse; print(urllib.parse.quote('$TEST_DB_PASSWORD', safe=''))")
          # SQLAlchemy doesn't test TLS; disable it (the dialect coerces ssl=false to a bool).
          DBURI="${DIALECT_PREFIX}+mariadbconnector://$TEST_DB_USER:${ENCODED_PASSWORD}@$TEST_DB_HOST:$TEST_DB_PORT/$TEST_DB?ssl=false"
          echo "Testing with dburi: ${DIALECT_PREFIX}+mariadbconnector://$TEST_DB_USER:****@$TEST_DB_HOST:$TEST_DB_PORT/$TEST_DB?ssl=false"
          # Skip problematic tests
          # test/aaa_profiling/: SQLAlchemy's heap-growth tests run each case in a
          # forked subprocess that shares the parent's DB socket — no DBAPI in
          # the Python ecosystem (pymysql/mysqlclient/mysql-connector-python)
          # supports this pattern.  These tests profile SQLAlchemy itself, not
          # the connector, so they don't belong in connector CI.
          DESELECT_PATTERN="not VersioningTest"
          if [[ "${{ matrix.os }}" == "windows-latest" || "${{ matrix.os }}" == "macos-latest" ]]; then
            DESELECT_PATTERN="not (test_reflect_case_insensitive or test_reflect_via_fk or test_case_sensitive_column_constraint_reflection or test_get_names) and not VersioningTest"
          fi
          python -m pytest -xvs --dburi="$DBURI" --backend-only --ignore=test/aaa_profiling -k "$DESELECT_PATTERN"
        env:
          TEST_DB_USER: ${{ env.MYSQL_TEST_USER }}
          TEST_DB_HOST: ${{ env.MYSQL_TEST_HOST }}
          TEST_DB_DATABASE: ${{ env.MYSQL_TEST_DB }}
          TEST_DB_PORT: ${{ env.MYSQL_TEST_PORT }}
          TEST_DB_PASSWORD: ${{ env.MYSQL_TEST_PASSWD }}
          TEST_DB: ${{ env.MYSQL_TEST_DB }}

      - name: Run SQLAlchemy async tests (C extension)
        # See note above: ssl=false; default Python 3.13 only (PyPy fails).
        if: ${{ (matrix.python == '' || matrix.python == '3.13') && matrix.db-type != 'mysql' }}
        shell: bash
        run: |
          ulimit -c unlimited
          cd "$GITHUB_WORKSPACE/sqlalchemy"
          DIALECT_PREFIX="${{ matrix.db-type == 'mysql' && 'mysql' || 'mariadb' }}"
          # URL-encode password to handle special characters
          ENCODED_PASSWORD=$(python -c "import urllib.parse; print(urllib.parse.quote('$TEST_DB_PASSWORD', safe=''))")
          # SQLAlchemy doesn't test TLS; disable it (the dialect coerces ssl=false to a bool).
          DBURI="${DIALECT_PREFIX}+mariadbconnector_async://$TEST_DB_USER:${ENCODED_PASSWORD}@$TEST_DB_HOST:$TEST_DB_PORT/$TEST_DB?ssl=false"
          echo "Testing async with dburi: ${DIALECT_PREFIX}+mariadbconnector_async://$TEST_DB_USER:****@$TEST_DB_HOST:$TEST_DB_PORT/$TEST_DB?ssl=false"
          # Install greenlet for async support
          python -m pip install greenlet
          # Run async tests using mariadb_c connector's native async support
          # Exclude JSON decimal tests as they are "unexpected successes" (passing but marked as expected to fail)
          # Exclude ServerSideCursorsTest as it requires SQLAlchemy test suite modifications we can't ship
          # Exclude CTETest as it has teardown issues with foreign key constraints
          DESELECT_PATTERN="Async and not ((JSONTest and decimal1) or ServerSideCursorsTest or CTETest)"
          if [[ "${{ matrix.os }}" == "windows-latest" || "${{ matrix.os }}" == "macos-latest" ]]; then
            DESELECT_PATTERN="Async and not (test_reflect_case_insensitive or test_reflect_via_fk or test_case_sensitive_column_constraint_reflection or test_get_names or (JSONTest and decimal1) or ServerSideCursorsTest or CTETest)"
          fi
          python -m pytest -xvs --dburi="$DBURI" --backend-only -k "$DESELECT_PATTERN" test/dialect/test_suite.py
        env:
          TEST_DB_USER: ${{ env.MYSQL_TEST_USER }}
          TEST_DB_HOST: ${{ env.MYSQL_TEST_HOST }}
          TEST_DB_DATABASE: ${{ env.MYSQL_TEST_DB }}
          TEST_DB_PORT: ${{ env.MYSQL_TEST_PORT }}
          TEST_DB_PASSWORD: ${{ env.MYSQL_TEST_PASSWD }}
          TEST_DB: ${{ env.MYSQL_TEST_DB }}
          MARIADB_PYTHON_CONNECTOR: mariadb_c

      - name: Run test suite
        shell: bash
        run: |
          python --version
          # Install with dependencies (cryptography, packaging, pytest, etc.)
          python -m pip install .[test]
          cd mariadb-c && python -m pip install . && cd ..
          cd mariadb-pool && python -m pip install . && cd ..
          echo "=== Checking mariadb_c installation ==="
          python -c "import mariadb; import mariadb_c; print(f'mariadb_c location: {mariadb_c.__file__}')"
          echo "=== Checking which implementation is being used ==="
          python -c "import mariadb; print(f'Implementation: {mariadb.__impl__}'); print(f'SyncConnection: {mariadb.SyncConnection}')"
          echo "=== Environment variable check ==="
          python -c "import os; print(f'MARIADB_PYTHON_CONNECTOR={os.environ.get(\"MARIADB_PYTHON_CONNECTOR\", \"NOT SET\")}')"
          # Enable core dumps for this process
          ulimit -c unlimited 2>/dev/null || true
          python -m pytest tests -v -s --cov=mariadb --cov=mariadb_c --cov=mariadb_pool --cov=mariadb_shared --cov-branch --cov-report=xml --cov-report=term
          echo "=== Coverage report for mariadb_c ==="
          python -m coverage report --include="*/mariadb_c/*" || echo "No mariadb_c coverage found"
        env:
          TEST_DB_USER: ${{ env.MYSQL_TEST_USER }}
          TEST_DB_HOST: ${{ env.MYSQL_TEST_HOST }}
          TEST_DB_DATABASE: ${{ env.MYSQL_TEST_DB }}
          TEST_DB_PORT: ${{ env.MYSQL_TEST_PORT }}
          TEST_DB_PASSWORD: ${{ env.MYSQL_TEST_PASSWD }}
          TEST_DB_SERVER_CERT: ${{ matrix.db-type != 'mysql' && steps.setup-env.outputs.database-type == 'container' && './.github/workflows/certs/ca_server.crt' || '' }}
          LOCAL_DB: ${{ steps.setup-env.outputs.database-type }}
          PYTHON_VERSION: ${{ steps.setup-python.outputs.python-version }}
          MARIADB_PYTHON_CONNECTOR: mariadb_c
          RUN_LONG_TEST: 1
          MAXSCALE_TAG: ${{ matrix.maxscale-tag || '' }}
          MXS_TLS_PORT: ${{ steps.setup-env.outputs.mxs-tls-port || '' }}

      - name: Analyze core dumps (Linux)
        if: ${{ always() && startsWith(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          echo "=== Searching for core dumps ==="
          # -type f so we don't pick up the sqlalchemy/doc/build/core directory.
          mapfile -t cores < <(find . -type f \( -name "core" -o -name "core.*" \))
          if [ ${#cores[@]} -eq 0 ]; then
            echo "No core dump found under $(pwd)"
          else
            # A crash actually happened: only now pull in the ~85 MB of debug
            # tooling (gdb + python3-dbg) needed to read the dump.
            if ! command -v gdb >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y gdb python3-dbg || true
            fi
            for core_file in "${cores[@]}"; do
              echo "Found core dump: $core_file"
              echo "=== Core dump info ==="
              file "$core_file"
              echo "=== Backtrace from core dump ==="
              gdb -batch -ex "thread apply all bt" -ex "quit" python3 "$core_file" 2>&1 || true
              echo "=== Python-specific backtrace ==="
              gdb -batch -ex "py-bt" -ex "quit" python3 "$core_file" 2>&1 || true
            done
          fi
          # Also check system core dumps
          if compgen -G "/var/crash/*" > /dev/null; then
            echo "=== System crash dumps ==="
            ls -lh /var/crash/
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  ci-c-coverage:
    # Dedicated job that builds the C extension with gcov instrumentation and
    # uploads C-level line coverage to codecov.  Single ubuntu/Python entry —
    # one report is enough; the main ci-c-extension matrix covers correctness.
    name: C Coverage (gcov)
    needs: setup
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Test Environment
        id: setup-env
        uses: mariadb-corporation/connector-ci-setup@master
        with:
          db-type: community
          db-tag: latest
          test-db-password: ${{ env.MYSQL_TEST_PASSWD }}
          test-db-database: ${{ env.MYSQL_TEST_DB }}
          test-db-port: ${{ env.MYSQL_TEST_PORT }}
          additional-conf: '--max_allowed_packet=40M --character-set-server=utf8mb4'
          os: ubuntu-latest
          init-script-folder: ${{ format('{0}/.github/workflows/init', github.workspace) }}

      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.13'

      - name: Clone C/C
        uses: GuillaumeFalourd/clone-github-repo-action@v2.3
        with:
          branch: '3.4'
          owner: 'mariadb-corporation'
          repository: 'mariadb-connector-c'

      - name: Build libmariadb (C/C)
        run: |
          cd ${{ github.workspace }}/mariadb-connector-c
          cmake . -DCMAKE_BUILD_TYPE=Release -DWITH_EXTERNAL_ZLIB=On -DCMAKE_INSTALL_PREFIX=/usr
          make -j4
          sudo make install
          echo "MARIADB_PLUGIN_DIR=`mariadb_config --plugindir`" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/lib/mariadb" >> $GITHUB_ENV

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Install mariadb-connector-python with gcov instrumentation
        env:
          CFLAGS: "-O0 -fprofile-arcs -ftest-coverage"
          LDFLAGS: "-fprofile-arcs"
        run: |
          python -m pip install .[test]
          # setuptools/wheel are required for the direct setup.py call.
          python -m pip install setuptools wheel
          cd mariadb-c
          mkdir -p build-coverage
          python setup.py build_ext \
              --inplace --force \
              --build-temp "$(pwd)/build-coverage"
          cd ..
          cd mariadb-pool && python -m pip install . && cd ..

      - name: Verify gcov instrumentation
        env:
          PYTHONPATH: ${{ github.workspace }}/mariadb-c
        run: |
          echo "=== .gcno files (build-time, under build-coverage/) ==="
          find mariadb-c/build-coverage -name '*.gcno' 2>/dev/null | head -20
          if [ -z "$(find mariadb-c/build-coverage -name '*.gcno' 2>/dev/null)" ]; then
            echo "ERROR: no .gcno files — build did not produce coverage instrumentation."
            exit 1
          fi
          echo "=== which .so does Python import? ==="
          LOADED_SO=$(python -c "import mariadb_c._mariadb as m; print(m.__file__)")
          echo "$LOADED_SO"
          echo "=== gcov symbol count in loaded .so ==="
          COUNT=$(nm -D "$LOADED_SO" 2>/dev/null | grep -c "__gcov" || true)
          echo "$COUNT  (non-zero = instrumented)"
          if [ "$COUNT" = "0" ]; then
            echo "ERROR: loaded .so has no __gcov_ symbols — coverage flags didn't reach the build."
            exit 1
          fi

      - name: Run test suite
        run: |
          python -m pytest tests -v -s --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}/mariadb-c
          TEST_DB_USER: ${{ env.MYSQL_TEST_USER }}
          TEST_DB_HOST: ${{ env.MYSQL_TEST_HOST }}
          TEST_DB_DATABASE: ${{ env.MYSQL_TEST_DB }}
          TEST_DB_PORT: ${{ env.MYSQL_TEST_PORT }}
          TEST_DB_PASSWORD: ${{ env.MYSQL_TEST_PASSWD }}
          LOCAL_DB: ${{ steps.setup-env.outputs.database-type }}
          MARIADB_PYTHON_CONNECTOR: mariadb_c
          RUN_LONG_TEST: 1

      - name: Generate C coverage report
        run: |
          echo "=== .gcda files under build-coverage/ ==="
          find mariadb-c/build-coverage -name '*.gcda' 2>/dev/null | head -20
          if [ -z "$(find mariadb-c/build-coverage -name '*.gcda' 2>/dev/null)" ]; then
            echo "ERROR: no .gcda files — instrumented .so was not executed."
            exit 1
          fi
          lcov --capture --directory mariadb-c/build-coverage \
               --output-file c-coverage.info \
               --rc geninfo_unexecuted_blocks=1
          # Strip system headers and Python.h that we don't author.
          # --ignore-errors unused: tolerate patterns that don't match (lcov
          # would otherwise fail when, e.g., no /usr/* headers got captured).
          lcov --remove c-coverage.info '/usr/*' '*/Python.h' \
               --output-file c-coverage.info \
               --ignore-errors unused
          lcov --list c-coverage.info

      - name: Upload C coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./c-coverage.info
          flags: c-extension

  build-source-packages:
    name: Build Source Packages
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    needs: [ci-pure-python, ci-c-extension]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel

      - name: Build mariadb (pure Python) package
        run: |
          python -m build --sdist --wheel --outdir dist/
        env:
          MARIADB_IMPL: pure

      - name: Build mariadb-c (C extension) package
        run: |
          cd mariadb-c
          python -m build --sdist --outdir ../dist/
        env:
          MARIADB_IMPL: c

      - name: Build mariadb-pool package
        run: |
          cd mariadb-pool
          python -m build --sdist --wheel --outdir ../dist/

      - name: List built packages
        run: |
          echo "Built packages:"
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-packages
          path: dist/*
