---
name: Run CI Tests

on:
  push:
    branches: ['1.1', '2.0*']
  pull_request:
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Publish to Test PyPI'
        required: false
        default: true
        type: boolean
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MYSQL_TEST_HOST: mariadb.example.com
  MYSQL_TEST_PORT: 3306
  MYSQL_TEST_USER: root
  MYSQL_TEST_PASSWD: "heyPassw-!*20oRd"
  MYSQL_TEST_DB: testp

jobs:

  setup:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'schedule' ||
      github.ref == 'refs/heads/1.1' ||
      startsWith(github.ref, 'refs/heads/2.0')
    outputs:
      fail-fast: false
      matrix: ${{ steps.set-matrix.outputs.final-matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        name: build matrix
        uses: mariadb-corporation/connector-ci-build-matrix@main
        with:
          additional-matrix: '[{"name": "MariaDB 11.4", "os": "ubuntu-latest", "db-type": "community", "db-tag": "11.4", "python": "3.10"},{"name": "MariaDB 11.4", "os": "ubuntu-latest", "db-type": "community", "db-tag": "11.4", "python": "3.11"},{"name": "MariaDB 11.4", "os": "ubuntu-latest", "db-type": "community", "db-tag": "11.4", "python": "3.12"},{"name": "MariaDB 11.4", "os": "ubuntu-latest", "db-type": "community", "db-tag": "11.4", "python": "3.12", "continue-on-error": true}, {"name": "MariaDB 11.4", "os": "ubuntu-latest", "db-type": "community", "db-tag": "11.4", "python": "pypy3.11"}]'

  ci-pure-python:
    name: ${{ matrix.name }} (Pure Python) ${{ matrix.python != '' && format(' - python {0}', matrix.python) || '' }}
    needs: setup
    timeout-minutes: 50
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue-on-error || false }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Test Environment
        id: setup-env
        uses: mariadb-corporation/connector-ci-setup@master
        with:
          node-version: ${{ matrix.node }}
          db-type: ${{ matrix.db-type }}
          db-tag: ${{ matrix.db-tag }}
          test-db-password: ${{ env.MYSQL_TEST_PASSWD }}
          test-db-database: ${{ env.MYSQL_TEST_DB }}
          test-db-port: ${{ env.MYSQL_TEST_PORT }}
          additional-conf: ${{ matrix.additional-conf || '--max_allowed_packet=40M --character-set-server=utf8mb4' }}
          registry-user: ${{ matrix.db-type == 'enterprise' && secrets.ENTERPRISE_USER || (secrets.DOCKER_PWD != '' && 'mariadbtest' || '') }}
          registry-password: ${{ matrix.db-type == 'enterprise' && secrets.ENTERPRISE_TOKEN || secrets.DOCKER_PWD }}
          os: ${{ matrix.os }}
          init-script-folder: ${{ format('{0}/.github/workflows/init', github.workspace) }}

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ matrix.python || '3.13' }}
          allow-prereleases: true

      - name: Run SQLAlchemy tests (Pure Python)
        if: ${{ matrix.db-type != 'mysql' || matrix.python == '3.13' || startsWith(matrix.python, '3.13')}}
        shell: bash
        run: |
          git clone https://github.com/sqlalchemy/sqlalchemy.git
          cd sqlalchemy
          git checkout rel_2_0
          python --version
          cd "$GITHUB_WORKSPACE"
          # Apply patches to SQLAlchemy for MariaDB Enterprise compatibility
          bash .github/scripts/apply-sqlalchemy-patches.sh "$GITHUB_WORKSPACE/sqlalchemy"
          python -m pip install .
          cd mariadb-pool && python -m pip install . && cd ..
          python -m pip install pytest typing_extensions
          cd "$GITHUB_WORKSPACE/sqlalchemy"
          python -m pip install -e .
          DIALECT_PREFIX="${{ matrix.db-type == 'mysql' && 'mysql' || 'mariadb' }}"
          # URL-encode password to handle special characters
          ENCODED_PASSWORD=$(python -c "import urllib.parse; print(urllib.parse.quote('$TEST_DB_PASSWORD', safe=''))")
          DBURI="${DIALECT_PREFIX}+mariadbconnector://$TEST_DB_USER:${ENCODED_PASSWORD}@$TEST_DB_HOST:$TEST_DB_PORT/$TEST_DB"
          echo "Testing with dburi: ${DIALECT_PREFIX}+mariadbconnector://$TEST_DB_USER:****@$TEST_DB_HOST:$TEST_DB_PORT/$TEST_DB"
          # Skip problematic tests
          DESELECT_PATTERN="not (TimeTest and test_select_direct)"
          if [[ "${{ matrix.os }}" == "windows-latest" || "${{ matrix.os }}" == "macos-latest" ]]; then
            DESELECT_PATTERN="not (test_reflect_case_insensitive or test_reflect_via_fk or test_case_sensitive_column_constraint_reflection or test_get_names or (TimeTest and test_select_direct))"
          fi
          python -m pytest -xvs --dburi="$DBURI" --backend-only -k "$DESELECT_PATTERN"
        env:
          TEST_DB_USER: ${{ env.MYSQL_TEST_USER }}
          TEST_DB_HOST: ${{ env.MYSQL_TEST_HOST }}
          TEST_DB_DATABASE: ${{ env.MYSQL_TEST_DB }}
          TEST_DB_PORT: ${{ env.MYSQL_TEST_PORT }}
          TEST_DB_PASSWORD: ${{ env.MYSQL_TEST_PASSWD }}
          TEST_DB: ${{ env.MYSQL_TEST_DB }}
          MARIADB_PYTHON_CONNECTOR: python

      - name: Run SQLAlchemy async tests (Pure Python)
        if: ${{ matrix.db-type != 'mysql' || matrix.python == '3.13' || startsWith(matrix.python, '3.13')}}
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/sqlalchemy"
          DIALECT_PREFIX="${{ matrix.db-type == 'mysql' && 'mysql' || 'mariadb' }}"
          # URL-encode password to handle special characters
          ENCODED_PASSWORD=$(python -c "import urllib.parse; print(urllib.parse.quote('$TEST_DB_PASSWORD', safe=''))")
          DBURI="${DIALECT_PREFIX}+mariadbconnector_async://$TEST_DB_USER:${ENCODED_PASSWORD}@$TEST_DB_HOST:$TEST_DB_PORT/$TEST_DB"
          echo "Testing async with dburi: ${DIALECT_PREFIX}+mariadbconnector_async://$TEST_DB_USER:****@$TEST_DB_HOST:$TEST_DB_PORT/$TEST_DB"
          # Install greenlet for async support
          python -m pip install greenlet
          # Run async tests using mariadb connector's native async support
          # Exclude JSON decimal tests as they are "unexpected successes" (passing but marked as expected to fail)
          # Exclude ServerSideCursorsTest as it requires SQLAlchemy test suite modifications we can't ship
          # Exclude CTETest as it has teardown issues with foreign key constraints
          DESELECT_PATTERN="Async and not ((TimeTest and test_select_direct) or (JSONTest and decimal1) or ServerSideCursorsTest or CTETest)"
          if [[ "${{ matrix.os }}" == "windows-latest" || "${{ matrix.os }}" == "macos-latest" ]]; then
            DESELECT_PATTERN="Async and not (test_reflect_case_insensitive or test_reflect_via_fk or test_case_sensitive_column_constraint_reflection or test_get_names or (TimeTest and test_select_direct) or (JSONTest and decimal1) or ServerSideCursorsTest or CTETest)"
          fi
          python -m pytest -xvs --dburi="$DBURI" --backend-only -k "$DESELECT_PATTERN" test/dialect/test_suite.py
        env:
          TEST_DB_USER: ${{ env.MYSQL_TEST_USER }}
          TEST_DB_HOST: ${{ env.MYSQL_TEST_HOST }}
          TEST_DB_DATABASE: ${{ env.MYSQL_TEST_DB }}
          TEST_DB_PORT: ${{ env.MYSQL_TEST_PORT }}
          TEST_DB_PASSWORD: ${{ env.MYSQL_TEST_PASSWD }}
          TEST_DB: ${{ env.MYSQL_TEST_DB }}
          MARIADB_PYTHON_CONNECTOR: python

      - name: Run test suite (Pure Python)
        shell: bash
        run: |
          python --version
          python -m pip install .
          cd mariadb-pool && python -m pip install . && cd ..
          python -m pip install pytest pytest-cov typing_extensions cryptography
          python -m pytest tests -v -s --cov=mariadb --cov=mariadb_pool --cov=mariadb_shared --cov-branch --cov-report=xml
        env:
          TEST_DB_USER: ${{ env.MYSQL_TEST_USER }}
          TEST_DB_HOST: ${{ env.MYSQL_TEST_HOST }}
          TEST_DB_DATABASE: ${{ env.MYSQL_TEST_DB }}
          TEST_DB_PORT: ${{ env.MYSQL_TEST_PORT }}
          TEST_DB_PASSWORD: ${{ env.MYSQL_TEST_PASSWD }}
          TEST_DB_SERVER_CERT: ${{ matrix.db-type != 'mysql' && steps.setup-env.outputs.database-type == 'container' && './.github/workflows/certs/ca_server.crt' || '' }}          
          LOCAL_DB: ${{ steps.setup-env.outputs.database-type }}
          PYTHON_VERSION: ${{ steps.setup-python.outputs.python-version }}
          MARIADB_PYTHON_CONNECTOR: mariadb
          RUN_LONG_TEST: 1

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
            
  ci-c-extension:
    name: ${{ matrix.name }} (C Extension) ${{ matrix.python != '' && format(' - python {0}', matrix.python) || '' }}
    needs: setup
    timeout-minutes: 50
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue-on-error || false }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Test Environment
        id: setup-env
        uses: mariadb-corporation/connector-ci-setup@master
        with:
          node-version: ${{ matrix.node }}
          db-type: ${{ matrix.db-type }}
          db-tag: ${{ matrix.db-tag }}
          test-db-password: ${{ env.MYSQL_TEST_PASSWD }}
          test-db-database: ${{ env.MYSQL_TEST_DB }}
          test-db-port: ${{ env.MYSQL_TEST_PORT }}
          additional-conf: ${{ matrix.additional-conf || '--max_allowed_packet=40M --character-set-server=utf8mb4' }}
          registry-user: ${{ matrix.db-type == 'enterprise' && secrets.ENTERPRISE_USER || (secrets.DOCKER_PWD != '' && 'mariadbtest' || '') }}
          registry-password: ${{ matrix.db-type == 'enterprise' && secrets.ENTERPRISE_TOKEN || secrets.DOCKER_PWD }}
          os: ${{ matrix.os }}
          init-script-folder: ${{ format('{0}/.github/workflows/init', github.workspace) }}

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ matrix.python || '3.13' }}
          allow-prereleases: true

      - name: Clone C/C
        uses: GuillaumeFalourd/clone-github-repo-action@v2.3
        with:
          branch: '3.4'
          owner: 'mariadb-corporation'
          repository: 'mariadb-connector-c'

      - name: c/c make ubuntu
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          cd ${{ github.workspace }}/mariadb-connector-c
          cmake . -DCMAKE_BUILD_TYPE=Release -DWITH_EXTERNAL_ZLIB=On -DCMAKE_INSTALL_PREFIX=/usr
          make -j4
          sudo make install
          echo "MARIADB_PLUGIN_DIR=`mariadb_config --plugindir`" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/lib/mariadb" >> $GITHUB_ENV

      - name: c/c make macos
        if: ${{ startsWith(matrix.os, 'mac') }}
        run: |
          cd ${{ github.workspace }}/mariadb-connector-c
          cmake . -DCMAKE_BUILD_TYPE=Release -DWITH_EXTERNAL_ZLIB=On
          make -j4
          sudo make install
          ls -lrt /usr/local/lib/mariadb/plugin
          echo "MARIADB_PLUGIN_DIR=`mariadb_config --plugindir`" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/lib/mariadb" >> $GITHUB_ENV
          echo "DYLD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib/mariadb:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "DYLD_FALLBACK_LIBRARY_PATH=/usr/local/lib:/usr/local/lib/mariadb" >> $GITHUB_ENV

      - name: c/c make windows
        if: ${{ startsWith(matrix.os, 'windows') }}
        shell: powershell
        run: |
          cd ${{ github.workspace }}/mariadb-connector-c
          $MARIADB_CC_INSTALL_DIR = "$env:USERPROFILE/conc"
          cmake . -DCMAKE_BUILD_TYPE=RelWithDebInfo -DWITH_CURL=ON -DCMAKE_INSTALL_PREFIX="$MARIADB_CC_INSTALL_DIR"
          cmake --build . --config RelWithDebInfo
          cmake --install . --config RelWithDebInfo
          echo "MARIADB_CC_INSTALL_DIR=$MARIADB_CC_INSTALL_DIR" >> $env:GITHUB_ENV
          echo "MARIADB_PLUGIN_DIR=$MARIADB_CC_INSTALL_DIR/lib/mariadb/plugin" >> $env:GITHUB_ENV

      - name: Run SQLAlchemy tests (C extension)
        if: ${{ matrix.db-type != 'mysql' || matrix.python == '3.13' || startsWith(matrix.python, '3.13')}}
        shell: bash
        run: |
          git clone https://github.com/sqlalchemy/sqlalchemy.git
          cd sqlalchemy
          git checkout rel_2_0
          python --version
          cd "$GITHUB_WORKSPACE"
          # Apply patches to SQLAlchemy for MariaDB Enterprise compatibility
          bash .github/scripts/apply-sqlalchemy-patches.sh "$GITHUB_WORKSPACE/sqlalchemy"
          python -m pip install .
          cd mariadb-c && python -m pip install . && cd ..
          cd mariadb-pool && python -m pip install . && cd ..
          python -m pip install pytest typing_extensions
          cd "$GITHUB_WORKSPACE/sqlalchemy"
          python -m pip install -e .
          DIALECT_PREFIX="${{ matrix.db-type == 'mysql' && 'mysql' || 'mariadb' }}"
          # URL-encode password to handle special characters
          ENCODED_PASSWORD=$(python -c "import urllib.parse; print(urllib.parse.quote('$TEST_DB_PASSWORD', safe=''))")
          DBURI="${DIALECT_PREFIX}+mariadbconnector://$TEST_DB_USER:${ENCODED_PASSWORD}@$TEST_DB_HOST:$TEST_DB_PORT/$TEST_DB"
          echo "Testing with dburi: ${DIALECT_PREFIX}+mariadbconnector://$TEST_DB_USER:****@$TEST_DB_HOST:$TEST_DB_PORT/$TEST_DB"
          # Skip problematic tests
          DESELECT_PATTERN="not (TimeTest and test_select_direct)"
          if [[ "${{ matrix.os }}" == "windows-latest" || "${{ matrix.os }}" == "macos-latest" ]]; then
            DESELECT_PATTERN="not (test_reflect_case_insensitive or test_reflect_via_fk or test_case_sensitive_column_constraint_reflection or test_get_names or (TimeTest and test_select_direct))"
          fi
          python -m pytest -xvs --dburi="$DBURI" --backend-only -k "$DESELECT_PATTERN"
        env:
          TEST_DB_USER: ${{ env.MYSQL_TEST_USER }}
          TEST_DB_HOST: ${{ env.MYSQL_TEST_HOST }}
          TEST_DB_DATABASE: ${{ env.MYSQL_TEST_DB }}
          TEST_DB_PORT: ${{ env.MYSQL_TEST_PORT }}
          TEST_DB_PASSWORD: ${{ env.MYSQL_TEST_PASSWD }}
          TEST_DB: ${{ env.MYSQL_TEST_DB }}

      - name: Run SQLAlchemy async tests (C extension)
        if: ${{ matrix.db-type != 'mysql' || matrix.python == '3.13' || startsWith(matrix.python, '3.13')}}
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/sqlalchemy"
          DIALECT_PREFIX="${{ matrix.db-type == 'mysql' && 'mysql' || 'mariadb' }}"
          # URL-encode password to handle special characters
          ENCODED_PASSWORD=$(python -c "import urllib.parse; print(urllib.parse.quote('$TEST_DB_PASSWORD', safe=''))")
          DBURI="${DIALECT_PREFIX}+mariadbconnector_async://$TEST_DB_USER:${ENCODED_PASSWORD}@$TEST_DB_HOST:$TEST_DB_PORT/$TEST_DB"
          echo "Testing async with dburi: ${DIALECT_PREFIX}+mariadbconnector_async://$TEST_DB_USER:****@$TEST_DB_HOST:$TEST_DB_PORT/$TEST_DB"
          # Install greenlet for async support
          python -m pip install greenlet
          # Run async tests using mariadb_c connector's native async support
          # Exclude JSON decimal tests as they are "unexpected successes" (passing but marked as expected to fail)
          # Exclude ServerSideCursorsTest as it requires SQLAlchemy test suite modifications we can't ship
          # Exclude CTETest as it has teardown issues with foreign key constraints
          DESELECT_PATTERN="Async and not ((TimeTest and test_select_direct) or (JSONTest and decimal1) or ServerSideCursorsTest or CTETest)"
          if [[ "${{ matrix.os }}" == "windows-latest" || "${{ matrix.os }}" == "macos-latest" ]]; then
            DESELECT_PATTERN="Async and not (test_reflect_case_insensitive or test_reflect_via_fk or test_case_sensitive_column_constraint_reflection or test_get_names or (TimeTest and test_select_direct) or (JSONTest and decimal1) or ServerSideCursorsTest or CTETest)"
          fi
          python -m pytest -xvs --dburi="$DBURI" --backend-only -k "$DESELECT_PATTERN" test/dialect/test_suite.py
        env:
          TEST_DB_USER: ${{ env.MYSQL_TEST_USER }}
          TEST_DB_HOST: ${{ env.MYSQL_TEST_HOST }}
          TEST_DB_DATABASE: ${{ env.MYSQL_TEST_DB }}
          TEST_DB_PORT: ${{ env.MYSQL_TEST_PORT }}
          TEST_DB_PASSWORD: ${{ env.MYSQL_TEST_PASSWD }}
          TEST_DB: ${{ env.MYSQL_TEST_DB }}
          MARIADB_PYTHON_CONNECTOR: mariadb_c

      - name: Enable core dumps (Linux)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          # Enable core dumps
          ulimit -c unlimited
          echo "Core dump size limit: $(ulimit -c)"
          # Set core dump pattern
          sudo sysctl -w kernel.core_pattern=core.%e.%p
          echo "Core pattern: $(cat /proc/sys/kernel/core_pattern)"
          # Install debugging tools
          sudo apt-get update && sudo apt-get install -y gdb python3-dbg || true

      - name: Run test suite
        shell: bash
        run: |
          python --version
          python -m pip install pytest pytest-cov typing_extensions cryptography
          # Install with dependencies (cryptography, packaging, etc.)
          python -m pip install .[test]
          cd mariadb-c && python -m pip install . && cd ..
          cd mariadb-pool && python -m pip install . && cd ..
          echo "=== Checking mariadb_c installation ==="
          python -c "import mariadb; import mariadb_c; print(f'mariadb_c location: {mariadb_c.__file__}')"
          echo "=== Checking which implementation is being used ==="
          python -c "import mariadb; print(f'Implementation: {mariadb.__impl__}'); print(f'SyncConnection: {mariadb.SyncConnection}')"
          echo "=== Environment variable check ==="
          python -c "import os; print(f'MARIADB_PYTHON_CONNECTOR={os.environ.get(\"MARIADB_PYTHON_CONNECTOR\", \"NOT SET\")}')"
          # Enable core dumps for this process
          ulimit -c unlimited 2>/dev/null || true
          echo "=== Running tests with debug malloc and verbose output ==="
          # Run with PYTHONMALLOC=debug to detect memory issues early
          # Use -vv for extra verbose output to see which test is running when it crashes
          PYTHONMALLOC=debug python -m pytest tests -vv -s --tb=short
          #--cov=mariadb --cov=mariadb_c --cov=mariadb_pool --cov=mariadb_shared --cov-branch --cov-report=xml --cov-report=term
          echo "=== Coverage report for mariadb_c ==="
          python -m coverage report --include="*/mariadb_c/*" || echo "No mariadb_c coverage found"
        env:
          TEST_DB_USER: ${{ env.MYSQL_TEST_USER }}
          TEST_DB_HOST: ${{ env.MYSQL_TEST_HOST }}
          TEST_DB_DATABASE: ${{ env.MYSQL_TEST_DB }}
          TEST_DB_PORT: ${{ env.MYSQL_TEST_PORT }}
          TEST_DB_PASSWORD: ${{ env.MYSQL_TEST_PASSWD }}
          TEST_DB_SERVER_CERT: ${{ matrix.db-type != 'mysql' && steps.setup-env.outputs.database-type == 'container' && './.github/workflows/certs/ca_server.crt' || '' }}          
          LOCAL_DB: ${{ steps.setup-env.outputs.database-type }}
          PYTHON_VERSION: ${{ steps.setup-python.outputs.python-version }}
          MARIADB_PYTHON_CONNECTOR: mariadb_c
          RUN_LONG_TEST: 1

      - name: Analyze core dumps (Linux)
        if: ${{ always() && startsWith(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          echo "=== Searching for core dumps ==="
          find . -name "core.*" -o -name "core" | while read core_file; do
            echo "Found core dump: $core_file"
            echo "=== Core dump info ==="
            file "$core_file"
            echo "=== Backtrace from core dump ==="
            gdb -batch -ex "thread apply all bt" -ex "quit" python3 "$core_file" 2>&1 || true
            echo "=== Python-specific backtrace ==="
            gdb -batch -ex "py-bt" -ex "quit" python3 "$core_file" 2>&1 || true
          done
          # Also check system core dumps
          if [ -f /var/crash/* ]; then
            echo "=== System crash dumps ==="
            ls -lh /var/crash/
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build-source-packages:
    name: Build Source Packages
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    needs: [ci-pure-python, ci-c-extension]
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel

      - name: Build mariadb (pure Python) package
        run: |
          python -m build --sdist --wheel --outdir dist/
        env:
          MARIADB_IMPL: pure

      - name: Build mariadb-c (C extension) package
        run: |
          cd mariadb-c
          python -m build --sdist --outdir ../dist/
        env:
          MARIADB_IMPL: c

      - name: Build mariadb-pool package
        run: |
          cd mariadb-pool
          python -m build --sdist --wheel --outdir ../dist/

      - name: List built packages
        run: |
          echo "Built packages:"
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-packages
          path: dist/*
