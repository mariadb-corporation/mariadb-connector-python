name: Release Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to:
        description: 'Publish to'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi
          - none
      release_mariadb:
        description: 'Release mariadb (Pure Python)'
        required: false
        default: true
        type: boolean
      release_mariadb_c:
        description: 'Release mariadb-c (C Extension)'
        required: false
        default: true
        type: boolean
      release_mariadb_pool:
        description: 'Release mariadb-pool'
        required: false
        default: true
        type: boolean
      release_mariadb_binary:
        description: 'Release mariadb-binary (Binary Wheels)'
        required: false
        default: true
        type: boolean

env:
  MYSQL_TEST_HOST: mariadb.example.com
  MYSQL_TEST_PORT: 3306
  MYSQL_TEST_USER: root
  MYSQL_TEST_PASSWD: "heyPassw-!*20oRd"
  MYSQL_TEST_DB: testp
  MARIADB_CONNECTOR_C_VERSION: 3.4.7

jobs:
  # Build mariadb (pure Python) package
  build-mariadb:
    name: Build mariadb (Pure Python)
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_mariadb == 'true')
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel

      - name: Build mariadb package
        run: |
          python -m build --sdist --wheel --outdir dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-dist
          path: dist/

  # Build mariadb-c (C extension) package
  build-mariadb-c:
    name: Build mariadb-c (C Extension)
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_mariadb_c == 'true')
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel

      - name: Build mariadb-c package
        run: |
          cd mariadb-c
          python -m build --sdist --outdir ../dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-c-dist
          path: dist/

  # Build mariadb-pool package
  build-mariadb-pool:
    name: Build mariadb-pool
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_mariadb_pool == 'true')
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel

      - name: Build mariadb-pool package
        run: |
          cd mariadb-pool
          python -m build --sdist --wheel --outdir ../dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-pool-dist
          path: dist/

  # Build mariadb-binary (binary wheels) - Linux
  build-mariadb-binary-linux:
    name: Build mariadb-binary (Linux ${{ matrix.platform }} ${{ matrix.arch }} ${{ matrix.pyver }})
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_mariadb_binary == 'true')
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        pyver: [cp310, cp311, cp312, cp313, cp314]
        platform: [manylinux, musllinux]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add hosts entry
        shell: bash
        run: echo "127.0.0.1 mariadb.example.com" | sudo tee -a /etc/hosts

      - name: Setup MariaDB Server
        id: setup-mariadb-linux
        uses: rusher/action-setup-mariadb@v1.6
        with:
          tag: '11.4'
          root-password: ${{ env.MYSQL_TEST_PASSWD }}
          user: 'myUser'
          password: ${{ env.MYSQL_TEST_PASSWD }}
          database: ${{ env.MYSQL_TEST_DB }}

      - name: Set up QEMU for multi-arch build
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v8.1.5

      - name: Cache MariaDB Connector/C build
        uses: actions/cache@v4
        with:
          path: /tmp/mariadb-connector-c.build
          key: mariadb-connector-c-${{ matrix.platform }}-${{ matrix.arch }}-${{ env.MARIADB_CONNECTOR_C_VERSION }}

      - name: Create the binary package source tree
        run: python3 ./tools/ci/copy_to_binary.py

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        with:
          package-dir: mariadb_binary
        env:
          TEST_DB_USER: 'root'
          TEST_DB_HOST: ${{ env.MYSQL_TEST_HOST }}
          TEST_DB_DATABASE: ${{ env.MYSQL_TEST_DB }}
          TEST_DB_PORT: ${{ env.MYSQL_TEST_PORT }}
          TEST_DB_PASSWORD: ${{ env.MYSQL_TEST_PASSWD }}          
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          CIBW_BUILD: ${{matrix.pyver}}-${{matrix.platform}}_${{matrix.arch}}
          CIBW_ARCHS_LINUX: auto aarch64
          CIBW_CONTAINER_ENGINE: "docker; create_args: --network=host --add-host=mariadb.example.com:127.0.0.1"
          CIBW_BEFORE_ALL_LINUX: |
            # Build MariaDB Connector/C from source
            if [ ! -d "/host/tmp/mariadb-connector-c.build" ]; then
              # Detect package manager (yum for manylinux, apk for musllinux)
              if command -v yum &> /dev/null; then
                # manylinux (CentOS/RHEL)
                yum install -y git gcc gcc-c++ make openssl-devel zlib-devel
                # Try cmake3 first, fall back to cmake
                if yum install -y cmake3 2>/dev/null; then
                  CMAKE_CMD=cmake3
                else
                  yum install -y cmake
                  CMAKE_CMD=cmake
                fi
              elif command -v apk &> /dev/null; then
                # musllinux (Alpine)
                apk add --no-cache git cmake gcc g++ make openssl-dev zlib-dev linux-headers
                CMAKE_CMD=cmake
              fi
              
              cd /tmp
              echo "Using MariaDB Connector/C version: $MARIADB_CONNECTOR_C_VERSION"
              git clone --depth 1 --branch v$MARIADB_CONNECTOR_C_VERSION https://github.com/mariadb-corporation/mariadb-connector-c.git
              cd mariadb-connector-c
              
              # Disable parsec plugin - requires OpenSSL 1.1.1+ (manylinux2014 has 1.0.2k)
              $CMAKE_CMD -DCMAKE_BUILD_TYPE=Release \
                         -DCMAKE_INSTALL_PREFIX=/host/tmp/mariadb-connector-c.build \
                         -DWITH_EXTERNAL_ZLIB=On \
                         -DPLUGIN_PARSEC=OFF .
              make -j$(nproc)
              make install
            fi
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            LD_LIBRARY_PATH="/host/tmp/mariadb-connector-c.build/lib:/host/tmp/mariadb-connector-c.build/lib/mariadb:$LD_LIBRARY_PATH" auditwheel repair -w {dest_dir} {wheel}
          CIBW_BEFORE_TEST_LINUX: >-
            pip install {project}/mariadb-pool
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            pytest {project}/tests/integration --color yes -v
          CIBW_ENVIRONMENT_PASS_LINUX: TEST_DB_USER TEST_DB_HOST TEST_DB_DATABASE TEST_DB_PORT TEST_DB_PASSWORD
          CIBW_ENVIRONMENT: >-
            MARIADB_IMPL=binary
            LOCAL_DB=${{ steps.setup-mariadb-linux.outputs.database-type }}
            MARIADB_CONNECTOR_C_DIR=/host/tmp/mariadb-connector-c.build
            PATH="/host/tmp/mariadb-connector-c.build/bin:$PATH"
            LD_LIBRARY_PATH="/host/tmp/mariadb-connector-c.build/lib:/host/tmp/mariadb-connector-c.build/lib/mariadb:/host/tmp/mariadb-connector-c.build/lib64"
            PKG_CONFIG_PATH="/host/tmp/mariadb-connector-c.build/lib/pkgconfig"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{matrix.pyver}}-${{matrix.platform}}_${{matrix.arch}}
          path: ./wheelhouse/*.whl

  # Build mariadb-binary (binary wheels) - macOS
  build-mariadb-binary-macos:
    name: Build mariadb-binary (macOS ${{ matrix.arch }} ${{ matrix.pyver }})
    runs-on: ${{ matrix.arch == 'x86_64' && 'macos-13' || 'macos-latest' }}
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_mariadb_binary == 'true')
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        pyver: [cp310, cp311, cp312, cp313, cp314]

    steps:
      - name: Checkout repos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add hosts entry
        shell: bash
        run: echo "127.0.0.1 mariadb.example.com" | sudo tee -a /etc/hosts

      - name: Setup MariaDB Server
        id: setup-mariadb-macos
        uses: rusher/action-setup-mariadb@v1.6
        with:
          tag: '11.4'
          root-password: ${{ env.MYSQL_TEST_PASSWD }}
          user: ${{ env.MYSQL_TEST_USER }}
          password: ${{ env.MYSQL_TEST_PASSWD }}
          database: ${{ env.MYSQL_TEST_DB }}

      - name: Cache MariaDB Connector/C build
        uses: actions/cache@v4
        with:
          path: /tmp/mariadb-connector-c-${{ matrix.arch }}.build
          key: mariadb-connector-c-${{ env.MARIADB_CONNECTOR_C_VERSION }}-macos-${{ matrix.arch }}

      - name: Create the binary package source tree
        run: python3 ./tools/ci/copy_to_binary.py

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        with:
          package-dir: mariadb_binary
        env:
          TEST_DB_USER: 'root'
          TEST_DB_HOST: ${{ env.MYSQL_TEST_HOST }}
          TEST_DB_DATABASE: ${{ env.MYSQL_TEST_DB }}
          TEST_DB_PORT: ${{ env.MYSQL_TEST_PORT }}
          TEST_DB_PASSWORD: ${{ env.MYSQL_TEST_PASSWD }}              
          CIBW_BUILD: ${{matrix.pyver}}-macosx_${{matrix.arch}}
          CIBW_ARCHS_MACOS: ${{matrix.arch}}
          MACOSX_ARCHITECTURE: ${{matrix.arch}}
          CIBW_BEFORE_ALL_MACOS: |
            # Build MariaDB Connector/C from source (native architecture)
            if [ ! -d "/tmp/mariadb-connector-c-${{matrix.arch}}.build" ]; then
              brew install cmake openssl@3
              cd /tmp
              echo "Using MariaDB Connector/C version: $MARIADB_CONNECTOR_C_VERSION"
              git clone --depth 1 --branch v$MARIADB_CONNECTOR_C_VERSION https://github.com/mariadb-corporation/mariadb-connector-c.git mariadb-connector-c-${{matrix.arch}}
              cd mariadb-connector-c-${{matrix.arch}}
              cmake -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_INSTALL_PREFIX=/tmp/mariadb-connector-c-${{matrix.arch}}.build \
                    -DCMAKE_OSX_ARCHITECTURES=${{matrix.arch}} \
                    -DWITH_EXTERNAL_ZLIB=On \
                    -DWITH_SSL=OPENSSL \
                    -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3) .
              make -j$(sysctl -n hw.ncpu)
              make install
            fi
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >-
            DYLD_LIBRARY_PATH="/tmp/mariadb-connector-c-${{matrix.arch}}.build/lib:/tmp/mariadb-connector-c-${{matrix.arch}}.build/lib/mariadb:$DYLD_LIBRARY_PATH"
            delocate-wheel --require-archs {delocate_archs} --require-target-macos-version ${{ matrix.arch == 'arm64' && '15.0' || '13.0' }} --ignore-missing-dependencies -w {dest_dir} -v {wheel}
          CIBW_BEFORE_TEST_MACOS: >-
            pip install {project}/mariadb-pool
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            pytest {project}/tests/integration --color yes -v
          CIBW_ENVIRONMENT_PASS_MACOS: TEST_DB_USER TEST_DB_HOST TEST_DB_DATABASE TEST_DB_PORT TEST_DB_PASSWORD
          CIBW_ENVIRONMENT_MACOS: >-
            MARIADB_IMPL=binary
            LOCAL_DB=${{ steps.setup-mariadb-macos.outputs.database-type }}
            MARIADB_CONNECTOR_C_DIR=/tmp/mariadb-connector-c-${{matrix.arch}}.build
            PATH="/tmp/mariadb-connector-c-${{matrix.arch}}.build/bin:$PATH"
            DYLD_LIBRARY_PATH="/tmp/mariadb-connector-c-${{matrix.arch}}.build/lib:/tmp/mariadb-connector-c-${{matrix.arch}}.build/lib/mariadb"
            PKG_CONFIG_PATH="/tmp/mariadb-connector-c-${{matrix.arch}}.build/lib/pkgconfig"
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.arch == 'arm64' && '15.0' || '13.0' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{matrix.pyver}}-${{matrix.arch}}
          path: ./wheelhouse/*.whl

  # Build mariadb-binary (binary wheels) - Windows
  build-mariadb-binary-windows:
    name: Build mariadb-binary (Windows ${{ matrix.pyver }})
    runs-on: windows-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_mariadb_binary == 'true')
    strategy:
      fail-fast: false
      matrix:
        arch: [win_amd64]
        pyver: [cp310, cp311, cp312, cp313, cp314]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add hosts entry
        shell: bash
        run: echo "127.0.0.1 mariadb.example.com" >> /c/Windows/System32/drivers/etc/hosts

      - name: Setup MariaDB Server
        id: setup-mariadb-windows
        uses: rusher/action-setup-mariadb@v1.6
        with:
          tag: '11.4'
          root-password: ${{ env.MYSQL_TEST_PASSWD }}
          user: ${{ env.MYSQL_TEST_USER }}
          password: ${{ env.MYSQL_TEST_PASSWD }}
          database: ${{ env.MYSQL_TEST_DB }}

      - name: Create the binary package source tree
        run: python3 ./tools/ci/copy_to_binary.py

      - name: Cache MariaDB Connector/C build
        uses: actions/cache@v4
        with:
          path: C:\mariadb-connector-c.build
          key: mariadb-connector-c-${{ env.MARIADB_CONNECTOR_C_VERSION }}-windows-amd64-v3

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        with:
          package-dir: mariadb_binary
        env:
          TEST_DB_USER: 'root'
          TEST_DB_HOST: ${{ env.MYSQL_TEST_HOST }}
          TEST_DB_DATABASE: ${{ env.MYSQL_TEST_DB }}
          TEST_DB_PORT: ${{ env.MYSQL_TEST_PORT }}
          TEST_DB_PASSWORD: ${{ env.MYSQL_TEST_PASSWD }}              
          CIBW_BUILD: ${{matrix.pyver}}-${{matrix.arch}}
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_BEFORE_ALL_WINDOWS: >-
            cmd /c "{project}\tools\ci\build_connector_c_windows.bat"
          CIBW_BEFORE_BUILD_WINDOWS: >-
            pip install delvewheel
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair -w {dest_dir} {wheel}
          CIBW_BEFORE_TEST_WINDOWS: >-
            pip install {project}/mariadb-pool
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            pytest {project}/tests/integration --color yes -v
          CIBW_ENVIRONMENT_PASS_WINDOWS: TEST_DB_USER TEST_DB_HOST TEST_DB_DATABASE TEST_DB_PORT TEST_DB_PASSWORD MARIADB_CC_INSTALL_DIR MARIADB_CONNECTOR_C_VERSION
          CIBW_ENVIRONMENT_WINDOWS: >-
            MARIADB_IMPL=binary
            LOCAL_DB=${{ steps.setup-mariadb-windows.outputs.database-type }}
            MARIADB_CC_INSTALL_DIR=C:\\mariadb-connector-c.build
            PATH="C:\\mariadb-connector-c.build\\bin;$PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{matrix.pyver}}-${{matrix.arch}}
          path: ./wheelhouse/*.whl

  # Merge all mariadb-binary wheels into one artifact
  merge-binary-wheels:
    name: Merge mariadb-binary wheels
    runs-on: ubuntu-latest
    needs: [build-mariadb-binary-linux, build-mariadb-binary-macos, build-mariadb-binary-windows]
    if: |
      !cancelled() && 
      (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_mariadb_binary == 'true'))
    
    steps:
      - name: Merge artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: mariadb-binary-dist
          pattern: "{linux,macos,windows}-*"
          delete-merged: true

  # Publish to TestPyPI (manual trigger or when specified)
  publish-testpypi:
    name: Publish ${{ matrix.package }} to TestPyPI
    runs-on: ubuntu-latest
    needs: [build-mariadb, build-mariadb-c, build-mariadb-pool, merge-binary-wheels]
    if: |
      !cancelled() &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to == 'testpypi') ||
       (github.event_name == 'release' && contains(github.event.release.tag_name, 'rc')))
    environment: testpypi
    permissions:
      id-token: write
    
    strategy:
      matrix:
        include:
          - package: mariadb
            artifact: mariadb-dist
            condition: release_mariadb
          - package: mariadb-c
            artifact: mariadb-c-dist
            condition: release_mariadb_c
          - package: mariadb-pool
            artifact: mariadb-pool-dist
            condition: release_mariadb_pool
          - package: mariadb-binary
            artifact: mariadb-binary-dist
            condition: release_mariadb_binary
    
    steps:
      - name: Check if package should be published
        id: check
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs[matrix.condition] }}" == "true" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Download artifacts
        if: steps.check.outputs.should_publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
        continue-on-error: true

      - name: Publish ${{ matrix.package }} to TestPyPI
        if: steps.check.outputs.should_publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          verbose: true

  # Publish to PyPI (release only or manual trigger)
  publish-pypi:
    name: Publish ${{ matrix.package }} to PyPI
    runs-on: ubuntu-latest
    needs: [build-mariadb, build-mariadb-c, build-mariadb-pool, merge-binary-wheels]
    if: |
      !cancelled() &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to == 'pypi') ||
       (github.event_name == 'release' && !contains(github.event.release.tag_name, 'rc')))
    environment: pypi
    permissions:
      id-token: write
    
    strategy:
      matrix:
        include:
          - package: mariadb
            artifact: mariadb-dist
            condition: release_mariadb
          - package: mariadb-c
            artifact: mariadb-c-dist
            condition: release_mariadb_c
          - package: mariadb-pool
            artifact: mariadb-pool-dist
            condition: release_mariadb_pool
          - package: mariadb-binary
            artifact: mariadb-binary-dist
            condition: release_mariadb_binary
    
    steps:
      - name: Check if package should be published
        id: check
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs[matrix.condition] }}" == "true" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Download artifacts
        if: steps.check.outputs.should_publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
        continue-on-error: true

      - name: Publish ${{ matrix.package }} to PyPI
        if: steps.check.outputs.should_publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
