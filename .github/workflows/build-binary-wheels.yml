name: Build Binary Wheels

# Build precompiled binary wheels for mariadb-binary package
# Similar to psycopg-binary, these wheels include all C dependencies

on:
  push:
    branches:
      - 2.0
    paths:
      - '.github/workflows/build-binary-wheels.yml'
      - 'mariadb_c/**'
      - 'tools/ci/**'
  workflow_dispatch:
  release:
    types: [published]

env:
  # MariaDB Connector/C version to bundle
  MARIADB_CONNECTOR_C_VERSION: "3.4.7"
  # Test database configuration
  MYSQL_TEST_HOST: mariadb.example.com
  MYSQL_TEST_PORT: 3306
  MYSQL_TEST_USER: myTestUser
  MYSQL_TEST_PASSWD: "heyPassw-!*20oRd"
  MYSQL_TEST_DB: testp

concurrency:
  # Cancel older requests of the same workflow in the same branch
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:

  linux:  # {{{
    runs-on: ubuntu-latest
    if: true

    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        pyver: [cp310, cp311, cp312, cp313, cp314]
        platform: [manylinux, musllinux]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add hosts entry
        shell: bash
        run: echo "127.0.0.1 mariadb.example.com" | sudo tee -a /etc/hosts

      - name: Setup MariaDB Server
        uses: rusher/action-setup-mariadb@v1.6
        with:
          tag: '11.4'
          root-password: ${{ env.MYSQL_TEST_PASSWD }}
          user: ${{ env.MYSQL_TEST_USER }}
          password: ${{ env.MYSQL_TEST_PASSWD }}
          database: ${{ env.MYSQL_TEST_DB }}

      - name: Set up QEMU for multi-arch build
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v8.1.5

      - name: Cache MariaDB Connector/C build
        uses: actions/cache@v4
        with:
          path: /tmp/mariadb-connector-c.build
          key: mariadb-connector-c-${{ matrix.platform }}-${{ matrix.arch }}-${{ env.MARIADB_CONNECTOR_C_VERSION }}

      - name: Create the binary package source tree
        run: python3 ./tools/ci/copy_to_binary.py

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        with:
          package-dir: mariadb_binary
        env:
          TEST_DB_USER: 'root'
          TEST_DB_HOST: ${{ env.MYSQL_TEST_HOST }}
          TEST_DB_DATABASE: ${{ env.MYSQL_TEST_DB }}
          TEST_DB_PORT: ${{ env.MYSQL_TEST_PORT }}
          TEST_DB_PASSWORD: ${{ env.MYSQL_TEST_PASSWD }}          
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          CIBW_BUILD: ${{matrix.pyver}}-${{matrix.platform}}_${{matrix.arch}}
          CIBW_ARCHS_LINUX: auto aarch64
          CIBW_CONTAINER_ENGINE: "docker; create_args: --network=host --add-host=mariadb.example.com:127.0.0.1"
          CIBW_BEFORE_ALL_LINUX: |
            # Build MariaDB Connector/C from source
            if [ ! -d "/host/tmp/mariadb-connector-c.build" ]; then
              # Detect package manager (yum for manylinux, apk for musllinux)
              if command -v yum &> /dev/null; then
                # manylinux (CentOS/RHEL)
                yum install -y git gcc gcc-c++ make openssl-devel zlib-devel
                # Try cmake3 first, fall back to cmake
                if yum install -y cmake3 2>/dev/null; then
                  CMAKE_CMD=cmake3
                else
                  yum install -y cmake
                  CMAKE_CMD=cmake
                fi
              elif command -v apk &> /dev/null; then
                # musllinux (Alpine)
                apk add --no-cache git cmake gcc g++ make openssl-dev zlib-dev linux-headers
                CMAKE_CMD=cmake
              fi
              
              cd /tmp
              git clone --depth 1 --branch v${{ env.MARIADB_CONNECTOR_C_VERSION }} https://github.com/mariadb-corporation/mariadb-connector-c.git
              cd mariadb-connector-c
              
              # Disable parsec plugin - requires OpenSSL 1.1.1+ (manylinux2014 has 1.0.2k)
              $CMAKE_CMD -DCMAKE_BUILD_TYPE=Release \
                         -DCMAKE_INSTALL_PREFIX=/host/tmp/mariadb-connector-c.build \
                         -DWITH_EXTERNAL_ZLIB=On \
                         -DPLUGIN_PARSEC=OFF .
              make -j$(nproc)
              make install
            fi
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            LD_LIBRARY_PATH="/host/tmp/mariadb-connector-c.build/lib:/host/tmp/mariadb-connector-c.build/lib/mariadb:$LD_LIBRARY_PATH" auditwheel repair -w {dest_dir} {wheel}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            pytest {project}/tests/integration --color yes -v
          CIBW_ENVIRONMENT_PASS_LINUX: MARIADB_CONNECTOR_C_VERSION TEST_DB_USER TEST_DB_HOST TEST_DB_DATABASE TEST_DB_PORT TEST_DB_PASSWORD
          CIBW_ENVIRONMENT: >-
            MARIADB_IMPL=binary
            MARIADB_CONNECTOR_C_DIR=/host/tmp/mariadb-connector-c.build
            PATH="/host/tmp/mariadb-connector-c.build/bin:$PATH"
            LD_LIBRARY_PATH="/host/tmp/mariadb-connector-c.build/lib:/host/tmp/mariadb-connector-c.build/lib/mariadb:/host/tmp/mariadb-connector-c.build/lib64"
            PKG_CONFIG_PATH="/host/tmp/mariadb-connector-c.build/lib/pkgconfig"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{matrix.pyver}}-${{matrix.platform}}_${{matrix.arch}}
          path: ./wheelhouse/*.whl

  # }}}

  macos:  # {{{
    runs-on: ${{ matrix.arch == 'x86_64' && 'macos-13' || 'macos-latest' }}
    if: true

    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        pyver: [cp310, cp311, cp312, cp313, cp314]

    steps:
      - name: Checkout repos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add hosts entry
        shell: bash
        run: echo "127.0.0.1 mariadb.example.com" | sudo tee -a /etc/hosts

      - name: Setup MariaDB Server
        uses: rusher/action-setup-mariadb@v1.6
        with:
          tag: '11.4'
          root-password: ${{ env.MYSQL_TEST_PASSWD }}
          user: ${{ env.MYSQL_TEST_USER }}
          password: ${{ env.MYSQL_TEST_PASSWD }}
          database: ${{ env.MYSQL_TEST_DB }}

      - name: Cache MariaDB Connector/C build
        uses: actions/cache@v4
        with:
          path: /tmp/mariadb-connector-c-${{ matrix.arch }}.build
          key: mariadb-connector-c-${{ env.MARIADB_CONNECTOR_C_VERSION }}-macos-${{ matrix.arch }}

      - name: Create the binary package source tree
        run: python3 ./tools/ci/copy_to_binary.py

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        with:
          package-dir: mariadb_binary
        env:
          TEST_DB_USER: 'root'
          TEST_DB_HOST: ${{ env.MYSQL_TEST_HOST }}
          TEST_DB_DATABASE: ${{ env.MYSQL_TEST_DB }}
          TEST_DB_PORT: ${{ env.MYSQL_TEST_PORT }}
          TEST_DB_PASSWORD: ${{ env.MYSQL_TEST_PASSWD }}              
          CIBW_BUILD: ${{matrix.pyver}}-macosx_${{matrix.arch}}
          CIBW_ARCHS_MACOS: ${{matrix.arch}}
          MACOSX_ARCHITECTURE: ${{matrix.arch}}
          CIBW_BEFORE_ALL_MACOS: |
            # Build MariaDB Connector/C from source (native architecture)
            if [ ! -d "/tmp/mariadb-connector-c-${{matrix.arch}}.build" ]; then
              brew install cmake openssl@3
              cd /tmp
              git clone --depth 1 --branch v${{ env.MARIADB_CONNECTOR_C_VERSION }} https://github.com/mariadb-corporation/mariadb-connector-c.git mariadb-connector-c-${{matrix.arch}}
              cd mariadb-connector-c-${{matrix.arch}}
              cmake -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_INSTALL_PREFIX=/tmp/mariadb-connector-c-${{matrix.arch}}.build \
                    -DCMAKE_OSX_ARCHITECTURES=${{matrix.arch}} \
                    -DWITH_EXTERNAL_ZLIB=On \
                    -DWITH_SSL=OPENSSL \
                    -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3) .
              make -j$(sysctl -n hw.ncpu)
              make install
            fi
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >-
            DYLD_LIBRARY_PATH="/tmp/mariadb-connector-c-${{matrix.arch}}.build/lib:/tmp/mariadb-connector-c-${{matrix.arch}}.build/lib/mariadb:$DYLD_LIBRARY_PATH"
            delocate-wheel --require-archs {delocate_archs} --require-target-macos-version ${{ matrix.arch == 'arm64' && '15.0' || '13.0' }} --ignore-missing-dependencies -w {dest_dir} -v {wheel}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            pytest {project}/tests/integration --color yes -v
          CIBW_ENVIRONMENT_PASS_MACOS: TEST_DB_USER TEST_DB_HOST TEST_DB_DATABASE TEST_DB_PORT TEST_DB_PASSWORD
          CIBW_ENVIRONMENT_MACOS: >-
            MARIADB_IMPL=binary
            MARIADB_CONNECTOR_C_DIR=/tmp/mariadb-connector-c-${{matrix.arch}}.build
            PATH="/tmp/mariadb-connector-c-${{matrix.arch}}.build/bin:$PATH"
            DYLD_LIBRARY_PATH="/tmp/mariadb-connector-c-${{matrix.arch}}.build/lib:/tmp/mariadb-connector-c-${{matrix.arch}}.build/lib/mariadb"
            PKG_CONFIG_PATH="/tmp/mariadb-connector-c-${{matrix.arch}}.build/lib/pkgconfig"
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.arch == 'arm64' && '15.0' || '13.0' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{matrix.pyver}}-${{matrix.arch}}
          path: ./wheelhouse/*.whl

  # }}}

  windows:  # {{{
    runs-on: windows-latest
    if: true

    strategy:
      fail-fast: false
      matrix:
        arch: [win_amd64]
        pyver: [cp310, cp311, cp312, cp313, cp314]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add hosts entry
        shell: bash
        run: echo "127.0.0.1 mariadb.example.com" >> /c/Windows/System32/drivers/etc/hosts

      - name: Setup MariaDB Server
        uses: rusher/action-setup-mariadb@v1.6
        with:
          tag: '11.4'
          root-password: ${{ env.MYSQL_TEST_PASSWD }}
          user: ${{ env.MYSQL_TEST_USER }}
          password: ${{ env.MYSQL_TEST_PASSWD }}
          database: ${{ env.MYSQL_TEST_DB }}

      - name: Create the binary package source tree
        run: python3 ./tools/ci/copy_to_binary.py

      - name: Cache MariaDB Connector/C build
        uses: actions/cache@v4
        with:
          path: C:\mariadb-connector-c.build
          key: mariadb-connector-c-${{ env.MARIADB_CONNECTOR_C_VERSION }}-windows-amd64-v2

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        with:
          package-dir: mariadb_binary
        env:
          TEST_DB_USER: 'root'
          TEST_DB_HOST: ${{ env.MYSQL_TEST_HOST }}
          TEST_DB_DATABASE: ${{ env.MYSQL_TEST_DB }}
          TEST_DB_PORT: ${{ env.MYSQL_TEST_PORT }}
          TEST_DB_PASSWORD: ${{ env.MYSQL_TEST_PASSWD }}              
          CIBW_BUILD: ${{matrix.pyver}}-${{matrix.arch}}
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_BEFORE_ALL_WINDOWS: >-
            cmd /c "{project}\tools\ci\build_connector_c_windows.bat"
          CIBW_BEFORE_BUILD_WINDOWS: >-
            pip install delvewheel
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair -w {dest_dir} {wheel}
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            pytest {project}/tests/integration --color yes -v
          CIBW_ENVIRONMENT_PASS_WINDOWS: TEST_DB_USER TEST_DB_HOST TEST_DB_DATABASE TEST_DB_PORT TEST_DB_PASSWORD
          CIBW_ENVIRONMENT_WINDOWS: >-
            MARIADB_IMPL=binary
            MARIADB_CC_INSTALL_DIR=C:\\mariadb-connector-c.build
            PATH="C:\\mariadb-connector-c.build\\bin;$PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{matrix.pyver}}-${{matrix.arch}}
          path: ./wheelhouse/*.whl

  # }}}

  merge:  # {{{
    runs-on: ubuntu-latest
    needs:
      - linux
      - macos
      - windows
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: mariadb-binary-wheels
          delete-merged: true

  # }}}

  publish-test:  # {{{
    runs-on: ubuntu-latest
    needs: merge
    if: github.event_name == 'workflow_dispatch'  # Only on manual trigger
    permissions:
      id-token: write  # For PyPI trusted publishing
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mariadb-binary-wheels
          path: dist/
  
      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
  
  # }}}

  publish:  # {{{
    runs-on: ubuntu-latest
    needs: merge
    if: github.event_name == 'release'
    permissions:
      id-token: write  # For PyPI trusted publishing
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mariadb-binary-wheels
          path: dist/
  
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
  
  # }}}
