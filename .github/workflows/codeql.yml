---
name: "CodeQL"

# Static application security testing (SAST) via CodeQL — deep taint and
# dataflow analysis, the Python/C equivalent of the analyzers used by the
# Java, C and Node.js connectors (CONPY-373, mirrors CONJS-357).
#
# Two language packs are scanned:
#   * python  — the shipped pure-Python library (mariadb, mariadb_shared)
#   * c-cpp   — the native C extension under mariadb-c/
#
# Results are uploaded to the repository's code-scanning (Security) tab.

on:
  push:
    branches: ['1.1*', '2.0*']
  pull_request:
    branches: ['1.1*', '2.0*']
  schedule:
    # Weekly deep scan, Monday 06:00 UTC (offset from the main CI cron).
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Required to upload results to the code-scanning API.
      security-events: write
      # Only needed for workflows in private repositories.
      actions: read
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Pure-Python analysis needs no build.
          - language: python
            build-mode: none
          # The C extension must be compiled so CodeQL can trace it.
          - language: c-cpp
            build-mode: manual

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        if: matrix.build-mode == 'manual'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build libmariadb (MariaDB Connector/C)
        if: matrix.build-mode == 'manual'
        run: |
          git clone --depth 1 --branch 3.4 \
            https://github.com/mariadb-corporation/mariadb-connector-c.git
          cd mariadb-connector-c
          cmake . -DCMAKE_BUILD_TYPE=Release -DWITH_EXTERNAL_ZLIB=On \
            -DCMAKE_INSTALL_PREFIX=/usr
          make -j"$(nproc)"
          sudo make install

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
          # security-extended adds the deeper taint/dataflow query suite.
          queries: security-extended

      # ---- Traced build: ONLY the extension's own C sources (mariadb-c/) ----
      - name: Build the C extension
        if: matrix.build-mode == 'manual'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          cd mariadb-c
          python setup.py build_ext --inplace --force \
            --build-temp "$(pwd)/build-codeql"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
