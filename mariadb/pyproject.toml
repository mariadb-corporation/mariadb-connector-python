[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mariadb"
version = "2.0.0-dev"
description = "MariaDB Connector/Python with Java-equivalent implementation"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.8"
license = {text = "LGPL 2.1"}
authors = [
    {name = "Georg Richter", email = "georg@mariadb.com"},
    {name = "MariaDB Corporation Ab"}
]
maintainers = [
    {name = "MariaDB Corporation Ab"}
]
keywords = ["MariaDB", "MySQL", "database", "connector"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: MacOS X", 
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "packaging",
    "cryptography>=3.0.0",
]

[project.optional-dependencies]
# C extension for better performance
c = [
    "mariadb-c @ file://./mariadb_c",
]
# Connection pooling
pool = [
    "mariadb-pool @ file://./mariadb_pool",
]
# All optional features
full = [
    "mariadb-c @ file://./mariadb_c",
    "mariadb-pool @ file://./mariadb_pool",
]
# Development dependencies
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
]
test = [
    "pytest>=6.0",
    "pytest-cov",
]

[project.urls]
Homepage = "https://www.github.com/mariadb-corporation/mariadb-connector-python"
Documentation = "https://mariadb-corporation.github.io/mariadb-connector-python/"
Repository = "https://www.github.com/mariadb-corporation/mariadb-connector-python"
"Bug Tracker" = "https://jira.mariadb.org/"
"Source Code" = "https://www.github.com/mariadb-corporation/mariadb-connector-python"
Changelog = "https://github.com/mariadb-corporation/mariadb-connector-python/blob/main/CHANGELOG.md"

[project.scripts]
mariadb-test = "mariadb.testing:main"

[tool.setuptools]
package-dir = {"mariadb" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-data]
mariadb = ["*.pyi", "py.typed"]

# Development tools configuration
[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["mariadb"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests", 
    "requires_server: marks tests that require a running MariaDB server",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["mariadb"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/testing/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
